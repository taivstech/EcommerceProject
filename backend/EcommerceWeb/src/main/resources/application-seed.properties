# Seed profile — disable web server entirely so Tomcat never starts
spring.main.web-application-type=none

# Disable schedulers so they don't fire during seed
spring.task.scheduling.pool.size=0

# Disable Elasticsearch autoconfiguration (not needed for seeding)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRestClientAutoConfiguration

# Disable Elasticsearch component scan
app.search.elasticsearch.enabled=false

# Let Hibernate create/update schema (DB was wiped clean)
spring.jpa.hibernate.ddl-auto=update

# Reduce startup noise
logging.level.org.springframework=WARN
logging.level.com.taivs.EcommerceWeb=INFO
logging.level.org.hibernate=WARN
