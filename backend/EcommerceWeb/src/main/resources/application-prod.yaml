
server:
  port: 8088
  servlet:
    context-path: /api
  shutdown: graceful

  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 10000
    connection-timeout: 20000
    max-http-header-size: 8KB
    max-http-form-post-size: 2MB

  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: EcommerceWeb

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      connection-test-query: "SELECT 1"
      pool-name: HikariCP-Prod
      leak-detection-threshold: 15000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none

    properties:
      hibernate.format_sql: false
      hibernate.generate_statistics: false

      hibernate.jdbc.batch_size: 50
      hibernate.jdbc.fetch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

      hibernate.query.plan_cache_max_size: 2048
      hibernate.query.in_clause_parameter_padding: true
      hibernate.default_batch_fetch_size: 50

      hibernate.jdbc.use_get_generated_keys: true
      hibernate.jdbc.use_scrollable_resultset: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

      jedis:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: -1ms

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    socket-timeout: 30s
    connection-timeout: 5s
  

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: async-
      shutdown:
        await-termination: true
        await-termination-period: 30s
    scheduling:
      pool:
        size: 10
      shutdown:
        await-termination: true
        await-termination-period: 30s

logging:
  level:
    root: INFO
    com.taivs.EcommerceWeb: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %msg%n"
  file:
    name: logs/app.log
    max-size: 100MB
    max-history: 10
    total-size-cap: 1GB


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ecomweb
      environment: production

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  recommendation:
    url: ${RECOMMENDATION_URL:http://recommendation:8000/api/recommendations}
  mail:
    from: ${APP_MAIL_FROM:taivs0903@gmail.com}
    from-name: ${APP_MAIL_FROM_NAME:Social Media}
  email:
    verification:
      expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
      base-url: ${APP_BASE_URL:https://feeds-hull-jaguar-dreams.trycloudflare.com/api}
    password-reset:
      expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

ghn:
  api-url: ${GHN_API_URL}
  token: ${GHN_TOKEN}
  shop-id: ${GHN_SHOP_ID}

vnpay:
  tmnCode: ${VNPAY_TMN_CODE}
  hashSecret: ${VNPAY_HASH_SECRET}
  paymentUrl: ${VNPAY_PAYMENT_URL}
  returnUrl: ${VNPAY_RETURN_URL}
  apiUrl: ${VNPAY_API_URL}
  ipnUrl: ${VNPAY_IPN_URL}

paypal:
  clientId: ${PAYPAL_CLIENT_ID}
  clientSecret: ${PAYPAL_CLIENT_SECRET}
  mode: ${PAYPAL_MODE:sandbox}
  returnUrl: ${PAYPAL_RETURN_URL}
  cancelUrl: ${PAYPAL_CANCEL_URL}

momo:
  partnerCode: ${MOMO_PARTNER_CODE}
  accessKey: ${MOMO_ACCESS_KEY}
  secretKey: ${MOMO_SECRET_KEY}
  paymentUrl: ${MOMO_PAYMENT_URL}
  returnUrl: ${MOMO_RETURN_URL}
  notifyUrl: ${MOMO_NOTIFY_URL}

brevo:
  api-key: ${BREVO_API_KEY}

imagekit:
  public-key: ${PUBLIC_KEY_IMAGE_KIT}
  private-key: ${PRIVATE_KEY_IMAGE_KIT}
  url-endpoint: ${IMAGE_KIT_URL_ENDPOINT}

spring.security.oauth2.client.registration.google.client-id: ${OUTBOUND_IDENTITY_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret: ${OUTBOUND_IDENTITY_CLIENT_SECRET}

spring.flyway.enabled: false
