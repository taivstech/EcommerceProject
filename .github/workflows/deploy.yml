name:  GoCart CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 1. BUILD BACKEND ───────────────────────────────────────
      - name: ☕ Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/EcommerceWeb
          file: ./backend/EcommerceWeb/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gocart-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── 2. BUILD RECOMMENDATION SERVICE ────────────────────────
      - name: 🐍 Build and push Recommendation
        uses: docker/build-push-action@v5
        with:
          context: ./recommendation-service
          file: ./recommendation-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gocart-recommendation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── 3. BUILD FRONTEND (Optional Docker Version) ─────────────
      - name: ⚛️ Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gocart-frontend:latest
          build-args: |
            VITE_API_URL=https://api.${{ github.event.repository.name }}.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build Summary
        run: echo "🎉 Mọi thứ đã được đẩy lên Docker Hub thành công!"
