services:
  # ─────────────────────────────────────────────────────────────────────────────
  # LAYER 1: DATABASE & CACHE (Internal network only, NOT exposed to internet)
  # ─────────────────────────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: gocart-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-gocart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - gocart_mysql_data:/var/lib/mysql
    # Port 3306 NOT exposed to host — internal Docker network only
    networks:
      - gocart-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gocart-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - gocart_redis_data:/data
    # Port 6379 NOT exposed to host — internal Docker network only
    networks:
      - gocart-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: gocart-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - gocart_elastic_data:/usr/share/elasticsearch/data
    # Port 9200 NOT exposed to host — internal Docker network only
    networks:
      - gocart-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────────
  # LAYER 2: APPLICATION SERVICES
  # (Exposed to Nginx on host via localhost:port — NOT directly to internet)
  # Architecture: Nginx (host) → localhost:8088 → gocart-backend container
  # ─────────────────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend/EcommerceWeb
      dockerfile: Dockerfile
    container_name: gocart-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      # Bind to localhost only — Nginx on host will proxy here
      # Direct internet access is blocked by UFW (only 80/443 open)
      - "127.0.0.1:8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      # ── Database ────────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ecommerce_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gocart}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # ── Cache ───────────────────────────────────────────────────────────────
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ── Search ──────────────────────────────────────────────────────────────
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      # ── Security & Auth ────────────────────────────────────────────────────────
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      OUTBOUND_IDENTITY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OUTBOUND_IDENTITY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OUTBOUND_IDENTITY_REDIRECT_URI: ${OUTBOUND_IDENTITY_REDIRECT_URI}
      # ── App URLs ────────────────────────────────────────────────────────────
      APP_BASE_URL: https://ecommerce.pro.vn/api
      APP_CORS_ALLOWED_ORIGINS: https://ecommerce.pro.vn,https://www.ecommerce.pro.vn
      # ── External Services (GHN, Payments, Media) ────────────────────────────
      GHN_API_URL: ${GHN_API_URL}
      GHN_TOKEN: ${GHN_TOKEN}
      GHN_SHOP_ID: ${GHN_SHOP_ID}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_API_URL: ${VNPAY_API_URL}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
      MOMO_PAYMENT_URL: ${MOMO_PAYMENT_URL}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL}
      MOMO_NOTIFY_URL: ${MOMO_NOTIFY_URL}
      PUBLIC_KEY_IMAGE_KIT: ${PUBLIC_KEY_IMAGE_KIT}
      PRIVATE_KEY_IMAGE_KIT: ${PRIVATE_KEY_IMAGE_KIT}
      IMAGE_KIT_URL_ENDPOINT: ${IMAGE_KIT_URL_ENDPOINT}
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      # ── Rate Limiting & JVM ──────────────────────────────────────────────────
      RECOMMENDATION_URL: ${RECOMMENDATION_URL}
      APP_RATE_LIMIT_ENABLED: "true"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - gocart-net

  recommendation:
    image: taivstech/gocart-recommendation:latest
    container_name: gocart-recommendation
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      # Bind to localhost only
      - "127.0.0.1:8000:8000"
    environment:
      # ── Database (used correct env var names for Python service) ─────────────
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ecommerce_db}
      DB_USER: ${MYSQL_USER:-gocart}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # ── Backend base URL (to call Spring Boot APIs) ──────────────────────────
      BACKEND_URL: http://backend:8088
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gocart-net

  # ─────────────────────────────────────────────────────────────────────────────
  # LAYER 1.5: FRONTEND (Built and served via internal Nginx)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://ecommerce.pro.vn/api
    container_name: gocart-frontend
    restart: always
    ports:
      # Bind to localhost only — Host Nginx will proxy here
      - "127.0.0.1:3000:3000"
    networks:
      - gocart-net

  # ─────────────────────────────────────────────────────────────────────────────
  # LAYER 3: MONITORING (Internal access only via Nginx or SSH tunnel)
  # ─────────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: gocart-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - gocart_prometheus_data:/prometheus
    ports:
      # Bind to localhost — access via SSH tunnel: ssh -L 9090:localhost:9090 user@vps
      - "127.0.0.1:9090:9090"
    networks:
      - gocart-net
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: gocart-grafana
    restart: always
    volumes:
      - gocart_grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
    ports:
      # Bind to localhost — access via SSH tunnel: ssh -L 3001:localhost:3001 user@vps
      - "127.0.0.1:3001:3000"
    networks:
      - gocart-net
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: gocart-node-exporter
    restart: always
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    # Internal only — scraped by Prometheus
    networks:
      - gocart-net

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  gocart_mysql_data:
  gocart_redis_data:
  gocart_elastic_data:
  gocart_prometheus_data:
  gocart_grafana_data:

# ─────────────────────────────────────────────────────────────────────────────
# NETWORKS
# All services communicate within gocart-net bridge.
# Nginx (installed on HOST) reaches backend via 127.0.0.1:8088
# ─────────────────────────────────────────────────────────────────────────────
networks:
  gocart-net:
    driver: bridge
