services:

  # ─────────────────────────────────────────
  # MySQL 8 (internal only)
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gocart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-gocart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=80
      --slow-query-log=1
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gocart-net


  redis:
    image: redis:7-alpine
    container_name: gocart-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 50mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - gocart-net


  # ─────────────────────────────────────────
  # Elasticsearch 8 (product search index)
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: gocart-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - gocart-net


  # ─────────────────────────────────────────
  # Backend (Spring Boot)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend/EcommerceWeb
      dockerfile: Dockerfile
    container_name: gocart-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ecommerce_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gocart}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      ELASTICSEARCH_URIS: http://elasticsearch:9200

      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}

      OUTBOUND_IDENTITY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OUTBOUND_IDENTITY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      APP_BASE_URL: https://feeds-hull-jaguar-dreams.trycloudflare.com/api

      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gocart-net
    deploy:
      resources:
        limits:
          memory: 700m


  # ─────────────────────────────────────────
  # Recommendation Service (Python FastAPI)
  # ─────────────────────────────────────────
  recommendation:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: gocart-recommendation
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ecommerce_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gocart}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      REFRESH_INTERVAL_MINUTES: 30
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - gocart-net
    deploy:
      resources:
        limits:
          memory: 1g


  # ─────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CURRENCY_SYMBOL: ${VITE_CURRENCY_SYMBOL}
    container_name: gocart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gocart-net


# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:

# ─────────────────────────────────────────
# Network
# ─────────────────────────────────────────
networks:
  gocart-net:
    driver: bridge