global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  - job_name: 'gocart-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # "backend" resolves via Docker DNS in gocart-net
      - targets: ['backend:8088']
    relabel_configs:
      - target_label: service
        replacement: gocart-backend

  # ── Python Recommendation Service ───────────────────────────────────────────
  - job_name: 'gocart-recommendation'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['recommendation:8000']
    relabel_configs:
      - target_label: service
        replacement: gocart-recommendation

  # ── VPS System Metrics (CPU, RAM, Disk) ─────────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: service
        replacement: vps-system

  # ── Prometheus itself ────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
