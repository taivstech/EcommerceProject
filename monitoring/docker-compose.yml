version: '3.8'

# Monitoring stack: Prometheus (scrape) + Grafana (visualize)
# Usage:
#   docker-compose -f monitoring/docker-compose.yml up -d
# Access:
#   Prometheus  → http://localhost:9090
#   Grafana     → http://localhost:3000  (admin / admin123)
#
# Recommended Grafana dashboards to import:
#   - JVM (Micrometer)   → https://grafana.com/grafana/dashboards/4701
#   - Spring Boot 3.x    → https://grafana.com/grafana/dashboards/19004
#   - HikariCP           → https://grafana.com/grafana/dashboards/6083

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'   # keep 7 days of metrics
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
