# ==============================================================================
# GoCart – Nginx Production Config
# Architecture: User → Internet → Cloudflare CDN → UFW Firewall → Nginx → Backend
# ==============================================================================

# ── Cloudflare Real IP Restore ─────────────────────────────────────────────────
# Cloudflare forwards real client IP via CF-Connecting-IP / X-Forwarded-For. 
# We must trust Cloudflare's IP ranges so nginx reports the client's true IP
# in access logs and Spring Boot can use it for rate-limiting.
# Cloudflare IPv4 ranges (update periodically from https://www.cloudflare.com/ips-v4)
geo $cloudflare_ip {
    default          0;
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
}

# ── Rate limit zones ───────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=5r/s;

# ── Upstream: Spring Boot Backend ─────────────────────────────────────────────
upstream gocart_backend {
    server 127.0.0.1:8088;
    keepalive 32;
}

# ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name ecommerce.pro.vn api.ecommerce.pro.vn;

    # Allow Certbot ACME challenge (Let's Encrypt renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.ecommerce.pro.vn;

    # ── SSL certificates (managed by Certbot) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.ecommerce.pro.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ecommerce.pro.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options            "DENY"                always;
    add_header X-Content-Type-Options     "nosniff"             always;
    add_header X-XSS-Protection           "1; mode=block"       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # ── Cloudflare IP Forwarding ───────────────────────────────────────────────
    # Restore real visitor IP from Cloudflare header
    real_ip_header     CF-Connecting-IP;
    set_real_ip_from   0.0.0.0/0;

    # ── Restrict direct IP access (force through Cloudflare) ──────────────────
    # Optional: uncomment in production once Cloudflare is fully configured
    # if ($cloudflare_ip = 0) {
    #     return 403 "Access denied: please use the official domain.";
    # }

    # ── WebSocket / STOMP (Chat & Real-time Notifications) ───────────────────
    location /api/ws {
        proxy_pass         http://gocart_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Auth endpoints (strict rate limit) ───────────────────────────────────
    location ~ ^/api/(auth/token|auth/forgot-password|auth/outbound) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://gocart_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── File / Media uploads (larger body) ───────────────────────────────────
    location /api/file {
        client_max_body_size 20m;
        proxy_pass           http://gocart_backend;
        proxy_http_version   1.1;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   120s;
    }

    # ── Main API (all other /api/* requests) ─────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://gocart_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;
    }

    # ── Block all other paths ─────────────────────────────────────────────────
    location / {
        return 404;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/gocart_access.log;
    error_log  /var/log/nginx/gocart_error.log warn;
}
